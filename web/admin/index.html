<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仙尘 · 游戏数据后台</title>
  <link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/admin/assets/logo.png" alt="仙尘">
        <div><strong>仙尘</strong><span>游戏数据中枢</span></div>
      </div>
      <nav id="navigation" aria-label="数据分类"></nav>
      <footer><span class="footer-status"></span><div><strong>仙尘服务在线</strong><small>随缘 · QQ官机插件</small></div></footer>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuButton" title="展开导航" aria-label="展开导航">☰</button>
        <div class="title-stack">
          <span class="eyebrow">XIANCHEN DATA CONSOLE</span>
          <h1 id="pageTitle">系统参数</h1>
          <p id="pageDescription">所有保存立即写入游戏数据库</p>
        </div>
        <div class="sync-state"><span></span><div><strong>数据库在线</strong><small>保存即时生效</small></div></div>
      </header>

      <section class="toolbar" aria-label="数据操作">
        <button class="primary" id="addButton"><span aria-hidden="true">＋</span> 新增</button>
        <div class="quick-actions" id="dashboardQuickActions" hidden>
          <button data-jump="mails">发送邮件</button>
          <button data-jump="notices">发布公告</button>
          <button data-jump="cdks">生成兑换码</button>
        </div>
        <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" placeholder="搜索名称、编码或说明"></label>
        <div class="notice-filters" id="noticeFilters" aria-label="公告筛选" hidden>
          <label><span>频道</span><select id="noticeTypeFilter"><option value="">全部频道</option><option value="公告">公告</option><option value="更新">更新</option><option value="修复">修复</option><option value="全区通报">全区通报</option></select></label>
          <label><span>发布状态</span><select id="noticePublishedFilter"><option value="">全部状态</option><option value="true">已发布</option><option value="false">未发布</option></select></label>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
          <input type="file" id="importInput" accept="application/json,.json" hidden>
          <input type="file" id="excelInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
          <button id="importButton">导入数据</button>
          <button id="exportButton">导出数据</button>
          <button id="excelImportButton">导入表格</button>
          <button id="excelExportButton">导出表格</button>
          <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <button id="imageButton">上传图片</button>
        </div>
      </section>

      <section class="data-region" aria-live="polite">
        <div class="table-wrap">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState" hidden>
            <strong>当前分类暂无数据</strong>
            <span>使用上方“新增”建立第一条内容。</span>
          </div>
        </div>
        <div class="pagination">
          <div class="pagination-summary"><span id="totalLabel">共 0 条</span><span id="rangeLabel">当前 0 条</span></div>
          <div class="pagination-controls">
            <label class="page-size-control"><span>每页</span><select id="pageSizeSelect"><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option></select><span>条</span></label>
            <button class="icon-button" id="prevButton" title="上一页" aria-label="上一页">←</button>
            <span id="pageLabel">1 / 1</span>
            <button class="icon-button" id="nextButton" title="下一页" aria-label="下一页">→</button>
            <label class="page-jump"><span>跳至</span><input id="pageJumpInput" type="number" min="1" value="1" inputmode="numeric" aria-label="跳转页码"><span>页</span><button id="pageJumpButton" type="button">前往</button></label>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="editorDialog">
    <form method="dialog" id="editorForm">
      <header><div><h2 id="editorTitle">编辑数据</h2><p>字段保存后立即作用于游戏。</p></div><button class="icon-button" type="button" id="closeEditorButton" title="关闭" aria-label="关闭">×</button></header>
      <div class="form-grid" id="formFields"></div>
      <footer><button type="button" id="cancelEditorButton">取消</button><button class="primary" type="submit" id="saveButton">保存</button></footer>
    </form>
  </dialog>

  <dialog id="noticeViewerDialog" class="notice-viewer">
    <header><div><span class="eyebrow">XIANCHEN NOTICE</span><h2 id="noticeViewerTitle">公告全文</h2></div><button class="icon-button" type="button" id="closeNoticeViewerButton" title="关闭" aria-label="关闭">×</button></header>
    <div class="notice-viewer-meta" id="noticeViewerMeta"></div>
    <article id="noticeViewerContent"></article>
    <footer><button type="button" id="noticeViewerDoneButton">关闭</button></footer>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/admin/js/app.js"></script>
</body>
</html>
