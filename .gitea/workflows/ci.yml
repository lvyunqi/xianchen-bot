name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  go-test:
    name: Go 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build embedded worker
        run: |
          mkdir -p plugin/embedded
          go build -o plugin/embedded/xianchen-worker .

  rust-check:
    name: Rust 插件检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin
      - name: prepare embedded worker
        run: |
          cd ..
          mkdir -p plugin/embedded
          go build -o plugin/embedded/xianchen-worker .
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all-targets
      - name: cargo build release
        run: cargo build --release
